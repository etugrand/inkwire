[project]
name = "inkwire-client"
version = "0.1.0"
description = "Client SDK for publishing posts to an Inkwire receiver (idempotent, retrying, typed errors)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.urls]
Repository = "https://github.com/etugrand/inkwire"

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["inkwire_client*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
